<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>API</title>
</head>
<body>
    <!-- 初始内容是空白的 -->
    <pre id="output"></pre>

    <script>
        // 1. 获取客户端在 URL 里传的 sr 和 lx 参数
        const urlParams = new URLSearchParams(window.location.search);
        let clientSr = urlParams.get('sr') || "";
        let lx = urlParams.get('lx') || "";

        // 2. 定义两个文件的真实地址
        const urlOjs = "https://hhgzs-hhbh.github.io/-/wiki/dj/all.json";
        const urlOjb = "https://hhgzs-hhbh.github.io/-/wiki/dj/wiki.json";

        // 3. 根据 lx 参数决定去请求哪个文件
        let targetJsonUrl = "";
        if (lx === "ojs") {
            targetJsonUrl = urlOjs;
        } else if (lx === "ojb") {
            targetJsonUrl = urlOjb;
        } else {
            // 如果没有传 lx 或者传错了，直接返回错误
            document.getElementById('output').textContent = `{"retcode": 400, "message": "参数错误"}`;
            return; // 停止执行
        }

        // 4. 发起请求
        fetch(targetJsonUrl)
            .then(res => res.text())
            .then(text => {
                let cleanText = text;
                let serverSr = "";
                let rawData = null;

                // 寻找第一行的状态码提取 sr
                const firstLineEnd = text.indexOf('\n');
                if (firstLineEnd !== -1) {
                    const firstLine = text.substring(0, firstLineEnd).trim();
                    try {
                        const metaInfo = JSON.parse(firstLine);
                        serverSr = metaInfo.sr || ""; 
                    } catch(e) {}
                    
                    // 剥离第一行，留下干净的 JSON
                    const startIdx = text.indexOf('{\n');
                    if (startIdx !== -1) {
                        cleanText = text.substring(startIdx);
                    }
                }

                try {
                    rawData = JSON.parse(cleanText);
                } catch (e) {
                    document.getElementById('output').textContent = `{"retcode": 500, "message": "参数错误"}`;
                    return;
                }

                // --- 5. 时间校验逻辑 ---
                const nowStr = new Date().toISOString();
                
                if (clientSr === "" || clientSr < serverSr) {
                    // 【情况一：时间不对】单行返回
                    const noResponse = {
                        retcode: 0,
                        message: "NO",
                        sr: "参数错误",
                        server_time: nowStr
                    };
                    document.getElementById('output').textContent = JSON.stringify(noResponse);
                } else {
                    // 【情况二：时间正确】头部单行，数据多行
                    const formattedData = JSON.stringify(rawData, null, 4); 
                    
                    // 利用字符串拼接，强行把外部包装变成单行
                    const okResponse = `{"retcode": 0, "message": "OK", "sr": "${nowStr}", "data": ${formattedData}}`;
                    
                    // 只有到了这一步，才把内容塞进网页里显示
                    document.getElementById('output').textContent = okResponse;
                }
            })
            .catch(err => {
                // 出错时才显示错误信息
                document.getElementById('output').textContent = `{"retcode": 500, "message": "请求失败：${err.message}"}`;
            });
    </script>
</body>
</html>
