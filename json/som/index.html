<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>API</title>
</head>
<body>
    <!-- 注意：这里依然保留 <pre> 标签，这样里面的换行符才能生效 -->
    <pre id="output">正在获取数据并校验...</pre>

    <script>
        // 1. 获取客户端在 URL 里传的 sr 参数
        const urlParams = new URLSearchParams(window.location.search);
        let clientSr = urlParams.get('sr') || "";

        // 2. 目标数据的真实地址
        const targetJsonUrl = "https://hhgzs-hhbh.github.io/-/wiki/dj/all.json";

        // 3. 请求目标 JSON 文件
        fetch(targetJsonUrl)
            .then(res => res.text())
            .then(text => {
                let cleanText = text;
                let serverSr = "";
                let rawData = null;

                // 寻找第一行的状态码提取 sr
                const firstLineEnd = text.indexOf('\n');
                if (firstLineEnd !== -1) {
                    const firstLine = text.substring(0, firstLineEnd).trim();
                    try {
                        const metaInfo = JSON.parse(firstLine);
                        serverSr = metaInfo.sr || ""; 
                    } catch(e) {}
                    
                    // 剥离第一行，留下干净的 JSON
                    const startIdx = text.indexOf('{\n');
                    if (startIdx !== -1) {
                        cleanText = text.substring(startIdx);
                    }
                }

                try {
                    rawData = JSON.parse(cleanText);
                } catch (e) {
                    document.getElementById('output').textContent = `{"retcode": 500, "message": "JSON解析失败"}`;
                    return;
                }

                // --- 时间校验逻辑 ---
                const nowStr = new Date().toISOString();
                
                if (clientSr === "" || clientSr < serverSr) {
                    // 【情况一：时间不对】
                    // 全部挤在一行，不加任何格式
                    const noResponse = {
                        retcode: 0,
                        message: "NO",
                        sr: "时间不正确",
                        server_time: nowStr
                    };
                    document.getElementById('output').textContent = JSON.stringify(noResponse);
                } else {
                    // 【情况二：时间正确】
                    // 注意这里：头部拼成单行，只把 rawData 格式化并缩进
                    const formattedData = JSON.stringify(rawData, null, 4); 
                    
                    // 利用字符串拼接，强行把外部包装变成单行
                    const okResponse = `{"retcode": 0, "message": "OK", "sr": "${nowStr}", "data": ${formattedData}}`;
                    
                    document.getElementById('output').textContent = okResponse;
                }
            })
            .catch(err => {
                document.getElementById('output').textContent = `{"retcode": 500, "message": "请求失败：${err.message}"}`;
            });
    </script>
</body>
</html>
