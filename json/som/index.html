<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>API</title>
</head>
<body>
    <pre id="output">正在获取数据并校验...</pre>

    <script>
        // 1. 获取客户端在 URL 里传的 sr 参数
        const urlParams = new URLSearchParams(window.location.search);
        let clientSr = urlParams.get('sr') || "";

        // 2. 目标数据的真实地址
        const targetJsonUrl = "https://hhgzs-hhbh.github.io/-/wiki/dj/all.json";

        // 3. 请求目标 JSON 文件
        fetch(targetJsonUrl)
            .then(res => res.text())
            .then(text => {
                let cleanText = text;
                let serverSr = "";
                let rawData = null;

                // 寻找第一行的状态码提取 sr
                const firstLineEnd = text.indexOf('\n');
                if (firstLineEnd !== -1) {
                    const firstLine = text.substring(0, firstLineEnd).trim();
                    try {
                        const metaInfo = JSON.parse(firstLine);
                        serverSr = metaInfo.sr || ""; 
                    } catch(e) {}
                    
                    // 剥离第一行，留下干净的 JSON
                    const startIdx = text.indexOf('{\n');
                    if (startIdx !== -1) {
                        cleanText = text.substring(startIdx);
                    }
                }

                try {
                    rawData = JSON.parse(cleanText);
                } catch (e) {
                    document.getElementById('output').textContent = JSON.stringify({retcode: 500, message: "JSON解析失败"});
                    return;
                }

                // --- 时间校验逻辑 ---
                if (clientSr === "" || clientSr < serverSr) {
                    // 【单行输出】：去掉了 null, 2，让它在一行显示
                    document.getElementById('output').textContent = JSON.stringify({
                        retcode: 0,
                        message: "NO",
                        sr: "时间不正确"
                    });
                } else {
                    // 【格式化输出】：保留 null, 2，让数据保持原本的换行缩进
                    document.getElementById('output').textContent = JSON.stringify(rawData, null, 2);
                }
            })
            .catch(err => {
                document.getElementById('output').textContent = JSON.stringify({
                    retcode: 500,
                    message: "请求失败：" + err.message
                });
            });
    </script>
</body>
</html>
