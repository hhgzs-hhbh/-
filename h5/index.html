<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>贪吃蛇</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="hud">
      <div class="score-box">
        <span class="label">分数</span>
        <span id="score">0</span>
      </div>
      <div class="score-box">
        <span class="label">最高</span>
        <span id="best">0</span>
      </div>
    </header>

    <div class="stage">
      <canvas id="game" width="400" height="400"></canvas>

      <div id="overlay" class="overlay">
        <h1 id="overlay-title">贪吃蛇</h1>
        <p id="overlay-text">方向键 / WASD 控制，手机点方向键</p>
        <button id="btn-start">开始游戏</button>
      </div>
    </div>

    <div class="controls">
      <button id="btn-pause" disabled>暂停</button>
      <button id="btn-reset">重新开始</button>
    </div>

    <div class="dpad">
      <button class="dpad-btn up"    data-dir="up">▲</button>
      <button class="dpad-btn left"  data-dir="left">◀</button>
      <button class="dpad-btn down"  data-dir="down">▼</button>
      <button class="dpad-btn right" data-dir="right">▶</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
